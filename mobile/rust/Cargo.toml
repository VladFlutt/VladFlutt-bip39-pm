[package]
name = "rust_lib_mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
bip39 = { version = "2", features = ["rand"] }
bip39-pm = { path = "../..", default-features = false, features = ["os-rng"] }
flutter_rust_bridge = "=2.13.0"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Отдельный крейт, не входит в workspace корня.
[workspace]
