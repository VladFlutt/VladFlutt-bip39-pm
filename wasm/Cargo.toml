[package]
name = "bip39-pm-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM-сборка ядра bip39-pm для расширения браузера"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bip39-pm = { path = "..", default-features = false }
bip39 = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }

