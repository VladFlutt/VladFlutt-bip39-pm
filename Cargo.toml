[package]
name = "bip39-pm"
version = "0.1.0"
edition = "2021"
description = "Детерминированный менеджер паролей на основе BIP39 seed (BIP85 + HKDF)"
license = "MIT"

[lib]
name = "bip39_pm"

[[bin]]
name = "pm"
path = "src/bin/pm.rs"

[dependencies]
bip39 = { version = "2", features = ["rand"] }
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"
unicode-normalization = "0.1"
url = "2"
psl = "=2.1.244"  # PSL заморожен: смена списка может изменить eTLD+1 и пароли
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
dirs = "5"
hex = "0.4"
