name: Mobile

on:
  push:
    paths: ["mobile/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/mobile.yml"]

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib integration_test
      - run: flutter analyze
      - run: xvfb-run -a flutter test integration_test -d linux

  android:
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: managerbip-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    runs-on: macos-latest
    needs: flutter
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter build ios --debug --no-codesign
